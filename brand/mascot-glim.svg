<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-labelledby="title desc">
  <title id="title">Glim, the img2threejs mascot</title>
  <desc id="desc">A friendly procedural forge sprite with an isometric cube body, a visual-gate lens, three source pixels, a materialisation scan ring, and articulated limbs.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cff"/>
      <stop offset="1" stop-color="#38e8ff"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2bd4c8"/>
      <stop offset="1" stop-color="#118a9c"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a3cf0"/>
      <stop offset="1" stop-color="#2a1a7a"/>
    </linearGradient>
    <linearGradient id="pixel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#ff8bd0"/>
    </linearGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b79aff"/>
      <stop offset="0.48" stop-color="#48e7f5"/>
      <stop offset="1" stop-color="#1e8f9f"/>
    </linearGradient>
    <radialGradient id="lens" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#f4faff"/>
      <stop offset="0.18" stop-color="#baf7ff"/>
      <stop offset="0.52" stop-color="#38e8ff"/>
      <stop offset="1" stop-color="#19708c"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cff" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#8b5cff" stop-opacity="0.82"/>
      <stop offset="0.54" stop-color="#38e8ff"/>
      <stop offset="0.82" stop-color="#2bd4c8" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#2bd4c8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="cyan-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pixel-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Grounding and the materialisation gate. -->
  <ellipse cx="606" cy="1030" rx="286" ry="48" fill="#080713" opacity="0.34" filter="url(#soft-shadow)"/>
  <ellipse cx="600" cy="835" rx="360" ry="104" fill="none" stroke="url(#scan)" stroke-width="9" opacity="0.84"/>
  <ellipse cx="600" cy="835" rx="300" ry="78" fill="none" stroke="#38e8ff" stroke-width="2" opacity="0.24"/>

  <!-- The three source pixels: image input becoming the character. -->
  <g filter="url(#pixel-glow)">
    <rect x="126" y="544" width="68" height="68" rx="16" fill="url(#pixel)" opacity="0.38" transform="rotate(-8 160 578)"/>
    <rect x="166" y="650" width="82" height="82" rx="19" fill="url(#pixel)" opacity="0.66" transform="rotate(5 207 691)"/>
    <rect x="260" y="704" width="92" height="92" rx="22" fill="url(#pixel)" opacity="0.94" transform="rotate(-3 306 750)"/>
  </g>

  <!-- Back limbs, kept as separate articulated segments. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M405 588 C334 600 304 640 285 689" stroke="#09081a" stroke-width="74"/>
    <path d="M405 588 C334 600 304 640 285 689" stroke="url(#limb)" stroke-width="46"/>
    <circle cx="334" cy="618" r="34" fill="#171331" stroke="#8b5cff" stroke-width="8"/>

    <path d="M801 566 C868 524 892 458 916 398" stroke="#09081a" stroke-width="74"/>
    <path d="M801 566 C868 524 892 458 916 398" stroke="url(#limb)" stroke-width="46"/>
    <circle cx="873" cy="488" r="34" fill="#171331" stroke="#38e8ff" stroke-width="8"/>

    <path d="M515 776 C502 847 482 909 463 955" stroke="#09081a" stroke-width="82"/>
    <path d="M515 776 C502 847 482 909 463 955" stroke="url(#limb)" stroke-width="50"/>
    <circle cx="493" cy="865" r="36" fill="#171331" stroke="#2bd4c8" stroke-width="8"/>

    <path d="M684 776 C698 848 720 910 742 955" stroke="#09081a" stroke-width="82"/>
    <path d="M684 776 C698 848 720 910 742 955" stroke="url(#limb)" stroke-width="50"/>
    <circle cx="710" cy="865" r="36" fill="#171331" stroke="#6a3cf0" stroke-width="8"/>
  </g>

  <!-- Cube core. The original 2:1 isometric geometry and palette stay intact. -->
  <g>
    <polygon points="600,294 824,410 600,526 376,410" fill="url(#top)"/>
    <polygon points="376,410 600,526 600,788 376,672" fill="url(#left)"/>
    <polygon points="824,410 600,526 600,788 824,672" fill="url(#right)"/>
    <path d="M376 410 L600 294 L824 410" fill="none" stroke="#f4faff" stroke-opacity="0.36" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M600 526 L600 788" fill="none" stroke="#0b0a1f" stroke-opacity="0.32" stroke-width="8" stroke-linecap="round"/>
    <path d="M584 324 L600 364 L640 380 L600 396 L584 436 L568 396 L528 380 L568 364 Z" fill="#f4faff" opacity="0.96"/>
  </g>

  <!-- Divine Eye: the visual-verification gate made into Glim's face. -->
  <g transform="rotate(-4 700 559)">
    <ellipse cx="704" cy="558" rx="93" ry="78" fill="#0a0918" opacity="0.86"/>
    <ellipse cx="704" cy="558" rx="76" ry="63" fill="none" stroke="#9b80ff" stroke-width="13" opacity="0.78"/>
    <ellipse cx="704" cy="558" rx="54" ry="48" fill="url(#lens)" filter="url(#cyan-glow)"/>
    <ellipse cx="683" cy="538" rx="15" ry="12" fill="#f4faff" opacity="0.96"/>
    <path d="M650 622 Q704 650 757 613" fill="none" stroke="#f4faff" stroke-width="10" stroke-linecap="round" opacity="0.86"/>
  </g>
  <g opacity="0.9">
    <circle cx="485" cy="573" r="12" fill="#ffd76a"/>
    <circle cx="519" cy="590" r="8" fill="#ff8bd0"/>
  </g>

  <!-- Left hand cups the final source pixel. -->
  <g>
    <circle cx="281" cy="716" r="48" fill="#171331" stroke="#2bd4c8" stroke-width="9"/>
    <path d="M252 708 C258 674 300 664 315 696 C325 719 310 748 284 756" fill="none" stroke="#baf7ff" stroke-width="15" stroke-linecap="round"/>
    <rect x="262" y="676" width="47" height="47" rx="11" fill="url(#pixel)" transform="rotate(8 285.5 699.5)" filter="url(#pixel-glow)"/>
  </g>

  <!-- Right hand waves: a friendly community signal. -->
  <g transform="translate(916 370) rotate(8)">
    <circle cx="0" cy="30" r="48" fill="#171331" stroke="#38e8ff" stroke-width="9"/>
    <path d="M-23 18 L-38 -38 M-6 5 L-10 -58 M13 8 L21 -52 M28 20 L47 -28" fill="none" stroke="#baf7ff" stroke-width="17" stroke-linecap="round"/>
    <path d="M-26 44 Q4 67 31 42" fill="none" stroke="#baf7ff" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Feet are broad and readable, with clear contact rather than a floating pose. -->
  <g>
    <path d="M401 958 Q462 922 520 966 L522 1011 Q454 1044 385 1012 Q382 984 401 958 Z" fill="#171331" stroke="#2bd4c8" stroke-width="10"/>
    <path d="M681 966 Q740 923 803 959 Q822 984 817 1012 Q746 1043 679 1010 Z" fill="#171331" stroke="#6a3cf0" stroke-width="10"/>
    <path d="M414 978 Q458 954 502 981" fill="none" stroke="#f4faff" stroke-width="6" opacity="0.38"/>
    <path d="M698 983 Q744 954 790 978" fill="none" stroke="#f4faff" stroke-width="6" opacity="0.38"/>
  </g>
</svg>
